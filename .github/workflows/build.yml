name: Build Artifacts
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      - "*.*.*"
env:
  GO111MODULE: on
  CGO_ENABLED: 1
  RSS_SERVER: 127.0.0.1:6379
  DOCKER_CLI_EXPERIMENTAL: "enabled"

permissions:
  contents: write

jobs:
  darwin:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: "6.0"
          auto-start: "true"

      - name: Tests
        run: |
          go mod tidy
          go test -v ./...

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: check --config build/darwin-amd64.yaml

      - name: Validate darwin-amd64 release build without publication
        if: github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: build --snapshot --clean --config build/darwin-amd64.yaml

      - name: Validate darwin-arm64 release build without publication
        if: github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: build --snapshot --clean --config build/darwin-arm64.yaml

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          version: latest
          args: release --clean --config build/darwin-amd64.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: 1

      - name: Upload assets (macos-amd64)
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: rssc-darwin-amd64
          path: dist/*.zip

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --config build/darwin-arm64.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: 1

      - name: Upload assets (macos-arm64)
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: rssc-darwin-arm64
          path: dist/*.zip

  linux:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      RSS_SERVER: 127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3


      - name: Tests
        run: |
          go mod tidy
          go test -v ./...

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to the GPR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cross-compiler for linux/arm64
        run: sudo apt-get install -y binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: check --config build/linux.yaml

      - name: Validate linux release build without publication
        if: github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: build --snapshot --clean --config build/linux.yaml

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --config build/linux.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets (linux)
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: RSS-Can
          path: dist/*.tar.gz

  report_release:
    name: Dispatch verified release reports
    needs: [darwin, linux]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Request reports for the released tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run go-quality-reports.yml --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f "source_ref=refs/tags/$RELEASE_TAG" -f reuse_existing_tag_report=true
