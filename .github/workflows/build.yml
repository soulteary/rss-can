name: Build Artifacts
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"
env:
  GO111MODULE: on
  CGO_ENABLED: 1
  RSS_SERVER: 127.0.0.1:6379
  DOCKER_CLI_EXPERIMENTAL: "enabled"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # Preserve immutable release builds, but stop spending runner time on
  # superseded branch and pull-request revisions.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release_tooling:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go for release fixture builds
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # This short gate builds tiny fixture binaries. Avoid a cache
          # restore/save cycle that cannot materially improve its runtime.
          cache: false
      - name: Test publication and recovery tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check tag, notes and Docker toolchain before publication
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_preflight.py "$TAG"

  darwin:
    needs: release_tooling
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: "6.0"
          auto-start: "true"

      - name: Set up Deno runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Tests
        run: |
          go mod tidy -diff
          go test -v ./...

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: check --config build/darwin-amd64.yaml

      - name: Validate darwin-amd64 release build without publication
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: build --snapshot --clean --config build/darwin-amd64.yaml

      - name: Validate darwin-arm64 release build without publication
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: build --snapshot --clean --config build/darwin-arm64.yaml

      - name: Build release archives without publication
        uses: goreleaser/goreleaser-action@v7
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          version: v2.18.3
          args: release --clean --skip=publish --config build/darwin-amd64.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: 0

      - name: Upload assets (macos-amd64)
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: release-darwin-amd64
          path: |
            dist/*.zip
            dist/*checksums.txt
          if-no-files-found: error

      - name: Build release archives without publication
        uses: goreleaser/goreleaser-action@v7
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --skip=publish --config build/darwin-arm64.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: 0

      - name: Upload assets (macos-arm64)
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: release-darwin-arm64
          path: |
            dist/*.zip
            dist/*checksums.txt
          if-no-files-found: error

  linux:
    needs: release_tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      RSS_SERVER: 127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Deno runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Tests
        run: |
          go mod tidy -diff
          go test -v ./...

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: check --config build/linux.yaml

      - name: Validate linux release build without publication
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: build --snapshot --clean --config build/linux.yaml

      - name: Build release archives without publication
        uses: goreleaser/goreleaser-action@v7
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --skip=publish --config build/linux.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets (linux)
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

  verify_archives:
    name: Verify archives before image publication
    needs: [darwin, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify checksums, payloads and exact source metadata
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source=$(git rev-parse HEAD)
          test "$(git rev-parse "$SOURCE_SHA^{commit}")" = "$source"
          test "$(git rev-list -n 1 "$TAG")" = "$source"
          python3 scripts/verify_release_assets.py release-assets "$TAG" "$source"

  images:
    name: Publish image (${{ matrix.arch }})
    needs: verify_archives
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Refuse to overwrite a published version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft"; then
            test "$(cat "$RUNNER_TEMP/is-draft")" = true
          fi
      - name: Record build time
        id: metadata
        run: |
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            soulteary/rss-can:${{ github.ref_name }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max

  image_manifests:
    name: Verify published multi-platform images
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Assemble and verify manifests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for image in soulteary/rss-can; do
            docker buildx imagetools create --tag "$image:$TAG" "$image:$TAG-amd64" "$image:$TAG-arm64"
            docker buildx imagetools inspect --raw "$image:$TAG" > "$RUNNER_TEMP/manifest.json"
            python3 -c 'import json,os; m=json.load(open(os.environ["RUNNER_TEMP"]+"/manifest.json")); p={(x["platform"].get("os"),x["platform"].get("architecture")) for x in m["manifests"]}; assert {("linux","amd64"),("linux","arm64")} <= p, p'
          done
      - name: Pull and smoke-test both architectures
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          export SOURCE_SHA
          trap 'docker rm -f rss-can-release-smoke >/dev/null 2>&1 || true' EXIT
          for image in soulteary/rss-can; do
            for arch in amd64 arm64; do
              docker pull --platform "linux/$arch" "$image:$TAG"
              docker run --rm -d --name rss-can-release-smoke --platform "linux/$arch" -p 127.0.0.1:18080:8080 -e RSS_REDIS=false "$image:$TAG"
              for attempt in $(seq 1 30); do
                if curl --fail --silent http://127.0.0.1:18080/_/health/ > "$RUNNER_TEMP/health.json"; then break; fi
                echo "Waiting for $arch ($attempt/30)"
                sleep 1
              done
              python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/health.json"))["message"] == "pong"'
              curl --fail --silent http://127.0.0.1:18080/ | grep -F "$TAG"
              curl --fail --silent http://127.0.0.1:18080/feed > "$RUNNER_TEMP/feed.html"
              test -s "$RUNNER_TEMP/feed.html"
              docker logs rss-can-release-smoke > "$RUNNER_TEMP/container.log" 2>&1
              grep -F "version: $TAG commit: $SOURCE_SHA" "$RUNNER_TEMP/container.log"
              docker image inspect "$image:$TAG" --format '{{json .Config.Labels}}' > "$RUNNER_TEMP/labels.json"
              python3 -c 'import json,os; m=json.load(open(os.environ["RUNNER_TEMP"]+"/labels.json")); assert m["org.opencontainers.image.version"] == os.environ["TAG"]; assert m["org.opencontainers.image.revision"] == os.environ["SOURCE_SHA"]'
              docker rm -f rss-can-release-smoke
            done
          done
      - name: Promote verified image manifests to latest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for image in soulteary/rss-can; do
            docker buildx imagetools create --tag "$image:latest" "$image:$TAG"
          done

  publish_release:
    name: Verify archives and publish Release
    needs: [darwin, linux, image_manifests]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify checksums, payloads and exact source metadata
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source=$(git rev-parse HEAD)
          test "$(git rev-parse "$SOURCE_SHA^{commit}")" = "$source"
          test "$(git rev-list -n 1 "$TAG")" = "$source"
          python3 scripts/verify_release_assets.py release-assets "$TAG" "$source"
      - name: Upload and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          python3 scripts/publish_release.py release-assets "$TAG" "$(git rev-parse HEAD)"
          --repo "$REPOSITORY" --notes "docs/releases/$TAG.md"

  report_release:
    name: Dispatch verified release reports
    needs: publish_release
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Request reports for the released tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run go-quality-reports.yml --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f "source_ref=refs/tags/$RELEASE_TAG" -f reuse_existing_tag_report=true
