version: 2

project_name: RSS-Can

builds:
  - id: linux-amd64
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    ldflags:
      - -w -s
      - -X "github.com/soulteary/RSS-Can/internal/version.Version={{ .Tag }}"
      - -X "github.com/soulteary/RSS-Can/internal/version.Commit={{.Commit}}"
      - -X "github.com/soulteary/RSS-Can/internal/version.BuildDate={{.Date}}"
    goos:
      - linux
    goarch: [ amd64 ]
    binary: rssc

  - id: linux-arm64
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    ldflags:
      - -w -s
      - -X "github.com/soulteary/RSS-Can/internal/version.Version={{ .Tag }}"
      - -X "github.com/soulteary/RSS-Can/internal/version.Commit={{.Commit}}"
      - -X "github.com/soulteary/RSS-Can/internal/version.BuildDate={{.Date}}"
    goos:
      - linux
    goarch: [ arm64 ]
    binary: rssc

archives:
  - formats: [tar.gz]
    files:
      - src: build/runtime/{{ .Os }}_{{ .Arch }}/deno
        dst: deno
        info:
          mode: 0755
      - build/deno-runtime.json
      - LICENSE
      - README.md
      - README_CN.md
      - CREDITS.md
      - DEPENDENCIES.md
      - docs/deno-prototype.md
      - docs/upgrading.md
      - .github/coverage.svg
      - .github/goreportcard.svg
      - .github/go-test-report.md
      - .github/goreportcard-report.md
      - .github/images/hp.jpg
      - .github/images/feeds.jpg
      - docs/secure-deployment.md
      - docs/stargate-access.md
      - docs/stargate-setup.md
      - docs/fetch-policy.md
      - docs/feed-content-safety.md
      - docs/feed-snapshots.md
      - docs/observability.md
      - docs/testing.md
      - docs/feeds-performance.md
      - docs/goquery-performance.md
      - docs/html-to-markdown-performance.md
      - docs/benchmarks/feed-load.md
      - docs/benchmarks/README.md
      - docs/benchmarks/deno-v8go.md
      - docs/benchmarks/deno-worker.md
      - docs/benchmarks/2026-10-28-coverage.json
      - docs/benchmarks/2026-10-28-deno-v8go.json
      - docs/benchmarks/2026-10-28-deno-worker-soak.json
      - docs/benchmarks/2026-10-28-deno-worker.json
      - docs/benchmarks/2026-10-28-feed-load.json
      - docs/benchmarks/2026-10-28-v8go-soak.json
      - example/README.md
      - example/1.standalone/docker-compose.yml
      - example/2.with-redis-cache/docker-compose.yml
      - example/3.enable-csr-render/docker-compose.yml
      - example/4.with-stargate/README.md
      - example/4.with-stargate/compose.yml
      - example/4.with-stargate/nginx.conf.template
      - example/4.with-stargate/setup.py
      - example/4.with-stargate/verify.py
      - example/4.with-stargate/rss_operator.py
      - example/4.with-stargate/.gitignore
      - CHANGELOG.md
      - docs/releases/*.md
      - third_party/licenses/*
      - internal/jssdk/js/*.LICENSE
      - rules/**/*
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      formats: [zip]
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"

# https://goreleaser.com/customization/changelog/
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^build:'
      - '^ci:'
#      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^feat(deps):'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
      - '^Update'
  groups:
    - title: Dependency updates
      regexp: '^.*?(feat|fix)\(deps\)!?:.+$'
      order: 300
    - title: 'New Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 100
    - title: 'Security updates'
      regexp: '^.*?sec(\([[:word:]]+\))??!?:.+$'
      order: 150
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 200
    - title: 'Documentation updates'
      regexp: '^.*?doc(\([[:word:]]+\))??!?:.+$'
      order: 400
#    - title: 'Build process updates'
#      regexp: '^.*?build(\([[:word:]]+\))??!?:.+$'
#      order: 400
    - title: Other work
      order: 9999
release:
  footer: |
    **Full Changelog**: https://github.com/soulteary/rss-can/compare/{{ .PreviousTag }}...{{ .Tag }}
