name: Complete verified release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Original release tag
        required: true
      source_sha:
        description: Full immutable release source SHA
        required: true
      build_run_id:
        description: Original tag-triggered Build Artifacts run
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: build-refs/tags/${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Audit original tag and build result
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ inputs.build_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
          gh api "repos/$REPOSITORY/commits/$TAG" > "$RUNNER_TEMP/source.json"
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/build.json"
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python3 scripts/audit_release_run.py "$TAG" "$SOURCE_SHA" "$RUNNER_TEMP"
          git show "$SOURCE_SHA:go.mod" > "$RUNNER_TEMP/release.go.mod"
          git show "$SOURCE_SHA:docs/releases/$TAG.md" > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify original archive checksums and source identity
        env:
          TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/verify_release_assets.py release-assets "$TAG" "$SOURCE_SHA" --go-mod "$RUNNER_TEMP/release.go.mod"
      - name: Upload and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          python3 scripts/publish_release.py release-assets "$TAG" "$SOURCE_SHA"
          --repo "$REPOSITORY" --notes "$RUNNER_TEMP/release-notes.md" --go-mod "$RUNNER_TEMP/release.go.mod"
      - name: Request reports for the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ inputs.release_tag }}
        run: >-
          gh workflow run go-quality-reports.yml --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH"
          -f "source_ref=refs/tags/$TAG" -f reuse_existing_tag_report=true
