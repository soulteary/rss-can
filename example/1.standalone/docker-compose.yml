version: "3"

services:
  rssc:
    image: soulteary/rss-can:v0.4.0
    environment:
      - RSS_REDIS=false
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532,mode=700
    volumes:
      - ../../rules:/rules:ro
