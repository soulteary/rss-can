name: Coverage

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
env:
  GO111MODULE: on
  CGO_ENABLED: 1
  RSS_SERVER: 127.0.0.1:6379

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Deno runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Start isolated Chrome for required browser regressions
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          profile="$(mktemp -d "$RUNNER_TEMP/rss-can-chrome.XXXXXX")"
          chrome_log="$RUNNER_TEMP/rss-can-chrome.log"
          trap 'cat "$chrome_log"; kill "${chrome_pid:-}" 2>/dev/null || true' ERR
          "$chrome_bin" --headless=new --no-sandbox --disable-gpu --no-first-run --no-default-browser-check --remote-debugging-port=0 --user-data-dir="$profile" about:blank > "$chrome_log" 2>&1 &
          chrome_pid=$!
          echo "RSS_TEST_CHROME_PID=$chrome_pid" >> "$GITHUB_ENV"
          for attempt in $(seq 1 600); do
            if test -s "$profile/DevToolsActivePort"; then
              port="$(head -n 1 "$profile/DevToolsActivePort")"
              if [[ "$port" =~ ^[0-9]+$ ]] && curl --noproxy '*' --fail --silent --max-time 1 "http://127.0.0.1:$port/json/version" > "$RUNNER_TEMP/rss-can-chrome-version.json"; then
                echo "RSS_TEST_BROWSER_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
                echo "RSS_TEST_BROWSER_REQUIRED=1" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            kill -0 "$chrome_pid"
            sleep 0.1
          done
          echo "Chrome DevTools endpoint was not ready within the startup window" >&2
          cat "$chrome_log"
          kill "$chrome_pid" 2>/dev/null || true
          exit 1

      - name: Run coverage
        if: "!(github.event_name == 'pull_request')"
        run: go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Remove stale generated report evidence
        id: report_cleanup
        if: "!cancelled() && (github.event_name == 'pull_request')"
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.2)
        if: "github.event_name == 'pull_request'"
        id: go_test_report
        uses: soulteary/go-test-report-action@bf04b539f7bf2a6f67d602da4259904b3dcdeba1  # v1.1.2
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "0"
          test_args: "-count=1"
          version: "v1.1.2"
          cover_mode: "atomic"
          commit: "false"
      - name: Go quality report (v1.1.3)
        if: "!cancelled() && (github.event_name == 'pull_request') && steps.report_cleanup.outcome == 'success'"
        id: go_report_card
        uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970  # v1.1.3
        with:
          directory: "."
          version: "v1.1.3"
          threshold: "0"
          report: "true"
          commit: "false"
      - name: Reuse GTR coverage profile
        if: "github.event_name == 'pull_request'"
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: Upload read-only PR quality evidence
        if: "always() && steps.report_cleanup.outcome == 'success' && ((github.event_name == 'pull_request'))"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce runtime coverage budgets
        run: python3 scripts/check_coverage.py coverage.out

      - name: Stop isolated Chrome
        if: always()
        shell: bash
        run: |
          if test -n "${RSS_TEST_CHROME_PID:-}"; then
            kill "$RSS_TEST_CHROME_PID" || true
          fi
    permissions:
      contents: read
