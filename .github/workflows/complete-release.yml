name: Complete verified release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Original release tag
        required: true
        default: v0.3.12
      source_sha:
        description: Full immutable release source SHA
        required: true
        default: b42afa44bac8d8b3e02118cec8874588d555a43e
      build_run_id:
        description: Original tag-triggered Build Artifacts run
        required: true
        default: '40525576257'
permissions:
  contents: write
  actions: read
concurrency:
  group: complete-release-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Audit original tag and build result
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ inputs.build_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
          gh api "repos/$REPOSITORY/commits/$TAG" > "$RUNNER_TEMP/source.json"
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/build.json"
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python3 - <<'PYCODE'
          import json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          source=json.loads((root/'source.json').read_text())
          run=json.loads((root/'build.json').read_text())
          jobs=json.loads((root/'jobs.json').read_text())['jobs']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',os.environ['TAG'])
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['SOURCE_SHA'])
          assert source['sha']==run['head_sha']==os.environ['SOURCE_SHA']
          assert run['head_branch']==os.environ['TAG'] and run['event']=='push'
          assert run['path']=='.github/workflows/build.yml' and run['status']=='completed'
          required={'darwin','linux','Publish image (amd64)','Publish image (arm64)','Verify published multi-platform images'}
          assert required <= {j['name'] for j in jobs if j['conclusion']=='success'}
          failed=[j for j in jobs if j['conclusion']=='failure']
          assert len(failed)==1 and failed[0]['name']=='Verify archives and publish Release'
          assert [s['name'] for s in failed[0]['steps'] if s['conclusion']=='failure']==['Verify checksums, payloads and exact source metadata']
          assert all(j['conclusion']=='success' or j in failed or (j['name']=='Dispatch verified release reports' and j['conclusion']=='skipped') for j in jobs)
          PYCODE
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify original archive checksums and source identity
        env:
          TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/verify_release_assets.py release-assets "$TAG" "$SOURCE_SHA"
      - name: Upload and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="docs/releases/$TAG.md"
          test -f "$notes"
          if gh release view "$TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft"; then
            echo "Existing release draft=$(cat "$RUNNER_TEMP/is-draft")"
          else
            gh release create "$TAG" --repo "$REPOSITORY" --verify-tag --draft --title "$TAG" --notes-file "$notes"
            echo true > "$RUNNER_TEMP/is-draft"
          fi
          if test ! -f "$RUNNER_TEMP/is-draft" || test "$(cat "$RUNNER_TEMP/is-draft")" = true; then
            gh release upload "$TAG" release-assets/* --repo "$REPOSITORY" --clobber
          fi
          release_api=$(gh release view "$TAG" --repo "$REPOSITORY" --json apiUrl --jq .apiUrl)
          gh api "$release_api" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          release=json.load(open(os.environ['RUNNER_TEMP']+'/release.json'))
          files={p.name:p for p in pathlib.Path('release-assets').iterdir() if p.is_file()}
          assets={a['name']:a for a in release['assets']}
          assert set(files)==set(assets)
          for name,path in files.items():
              assert assets[name]['state']=='uploaded' and assets[name]['size']==path.stat().st_size
              assert assets[name]['digest']=='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest()
          PY
          if test ! -f "$RUNNER_TEMP/is-draft" || test "$(cat "$RUNNER_TEMP/is-draft")" = true; then
            gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --latest --title "$TAG" --notes-file "$notes"
          fi
